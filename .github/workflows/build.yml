name: Build UID Filter module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "sdkmanager=$SDKMGR"
          echo "=== preinstalled ndk ==="
          ls "$SDK/ndk" 2>/dev/null || echo "(none)"
          echo "=== available ndk packages ==="
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -u || true
          NDK_HOME=""
          for d in "$SDK"/ndk/27.*; do
            [ -d "$d" ] || continue
            NDK_HOME="$d"
            break
          done
          if [ -z "$NDK_HOME" ]; then
            for v in 27.3.13750724 27.2.12479018 27.1.12297006 27.0.12077973 26.3.11579264; do
              if "$SDKMGR" --install "ndk;$v" >/dev/null 2>&1 && [ -d "$SDK/ndk/$v" ]; then
                NDK_HOME="$SDK/ndk/$v"
                echo "installed: ndk;$v"
                break
              fi
            done
          fi
          [ -n "$NDK_HOME" ] || { echo "could not install any NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          ls "$NDK_HOME/toolchains/llvm/prebuilt/"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

      - name: Build module
        run: |
          set -euo pipefail
          echo "NDK=$ANDROID_NDK_HOME"
          # Upstream build.py hardcodes a Windows NDK layout; retarget it to Linux.
          sed -i 's|windows-x86_64|linux-x86_64|g; s|clang++\.exe|clang++|g; s|llvm-readelf\.exe|llvm-readelf|g' \
            tools/uid-seccomp-module/build.py
          grep -n 'prebuilt\|clang++\|readelf' tools/uid-seccomp-module/build.py
          python tools/uid-seccomp-module/build.py --module-only
          echo "=== build tree ==="
          find build -type f -printf '%p  %s bytes\n' | sort
          echo "=== sha256 ==="
          sha256sum build/*/*.zip

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: uid-filter-module
          path: |
            build/**/*.zip
            build/**/*.sha256
            build/**/artifacts.json
          if-no-files-found: error
